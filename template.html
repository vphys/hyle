<style>

  body { 
    margin: 0; 
    display: flex; 
    height: 100vh; 
    font-family: "helvetica neue", helvetica, arial, sans-serif; 
    background: #fdf6e342; 
    color: #000; 
    text-transform: lowercase; 
    overflow: hidden; 
  }

  aside { 
    width: 280px; 
    padding: 2.5rem; 
    border-right: 1px solid #000; 
    display: flex; 
    flex-direction: column;
    overflow-y: auto;
    flex-shrink: 0;
    scrollbar-width: none;
  }
  aside::-webkit-scrollbar { display: none; }

  main { 
    flex: 1; 
    overflow-y: auto; 
    padding: 4rem; 
    line-height: 1.6;
    scrollbar-width: thin;
    scrollbar-color: #000 #fff;
  }

  h1 { 
    font-size: 4rem;

    margin: 0 0 1.5rem 0; 
    letter-spacing: -4px;

  }

  p { margin: 0 0 1rem 0; max-width: 65ch; }
  
  nav { margin-top: auto; padding-top: 3rem; }
  nav a { display: block; margin-bottom: 0.4rem; font-weight: 500; }

  footer { 
    margin-top: 2rem; 
    font-size: 0.6rem; 
    opacity: 0.4; 
    letter-spacing: 0.5px;
  }
  footer a { text-decoration: none; border-bottom: 1px solid rgba(0,0,0,0.2); }

  a { color: #000; text-decoration: underline; text-underline-offset: 4px; }
  a:hover { background: #000; color: #fff; text-decoration: none; }

  pre, code { 
    font-family: monospace; 
    text-transform: none; 
    background: #f8f8f8; 
    max-width: 65ch; overflow-x: auto;
  }
  pre { padding: 1.5rem; overflow-x: auto; border: 1px solid #000; }

  @media (max-width: 750px) {
    body { flex-direction: column; height: auto; overflow: auto; }
    aside { width: 100%; border-right: none; border-bottom: 1px solid #000; height: auto; padding: 2rem; }
    main { height: auto; overflow: visible; padding: 2rem; }
    h1 { font-size: 3rem; }
  }
